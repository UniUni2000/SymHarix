name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Install pinned OpenCode runtime
        run: bun run runtime:install
      - run: bun run release:check

  package:
    name: Package ${{ matrix.asset_platform }}-${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            asset_platform: darwin
            arch: x64
            uname_arch: x86_64
            archive: tar
          - runner: macos-15
            platform: darwin
            asset_platform: darwin
            arch: arm64
            uname_arch: arm64
            archive: tar
          - runner: ubuntu-24.04
            platform: linux
            asset_platform: linux
            arch: x64
            uname_arch: x86_64
            archive: tar
          - runner: ubuntu-24.04-arm
            platform: linux
            asset_platform: linux
            arch: arm64
            uname_arch: aarch64
            archive: tar
          - runner: windows-2025
            platform: win32
            asset_platform: windows
            arch: x64
            archive: zip
          - runner: windows-11-arm
            platform: win32
            asset_platform: windows
            arch: arm64
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install production dependencies
        run: bun install --production --frozen-lockfile
      - name: Stage release package
        shell: bash
        env:
          SYMHARIX_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          bun run scripts/build-release.cjs \
            --output build/release-stage \
            --platform '${{ matrix.platform }}' \
            --arch '${{ matrix.arch }}'
      - name: Verify packaged launcher on POSIX
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          SYMHARIX_HOME="$RUNNER_TEMP/symharix-home" build/release-stage/SymHarix/bin/symharix version
          SYMHARIX_HOME="$RUNNER_TEMP/symharix-home" build/release-stage/SymHarix/bin/symharix help
          tar -czf 'build/symharix-${{ matrix.asset_platform }}-${{ matrix.arch }}.tar.gz' \
            -C build/release-stage SymHarix
      - name: Verify packaged launcher on Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $env:SYMHARIX_HOME = Join-Path $env:RUNNER_TEMP 'symharix-home'
          & .\build\release-stage\SymHarix\bin\symharix.cmd version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\release-stage\SymHarix\bin\symharix.cmd help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path .\build\release-stage\SymHarix `
            -DestinationPath '.\build\symharix-${{ matrix.asset_platform }}-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: symharix-${{ matrix.asset_platform }}-${{ matrix.arch }}
          path: build/symharix-${{ matrix.asset_platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum symharix-* > checksums.txt
      - name: Create release and upload verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
